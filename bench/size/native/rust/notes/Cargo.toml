[package]
name = "notes"
version = "0.1.0"
edition = "2021"

[dependencies]
tiny_http = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
argon2 = "0.5"
sha2 = "0.10"
subtle = "2"
getrandom = "0.3"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
ctrlc = "3"
