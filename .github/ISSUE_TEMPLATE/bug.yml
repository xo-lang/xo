name: Bug report
description: The compiler, the xo toolchain, or std did something wrong.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        A small program that reproduces the bug is worth more than a fix.
        For a vulnerability, do not open an issue; see SECURITY.md.
  - type: textarea
    id: program
    attributes:
      label: Program
      description: The smallest program that shows the bug (its xo.mod too, if it has one).
      render: xo
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command
      description: The command you ran, for example `xo run main.xo` or `xo build --backend=llvm`.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
      description: What you expected to happen.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual
      description: What happened instead, with the full output (diagnostics are JSON; paste them as they are).
      render: text
    validations:
      required: true
  - type: textarea
    id: version
    attributes:
      label: Version and platform
      description: The output of `xo version`, and your OS and CPU (for example macOS 27 arm64, Linux amd64).
      render: text
    validations:
      required: true
