<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Todos</title>
<style>
*{box-sizing:border-box}
body{margin:0;font:16px/1.4 -apple-system,Helvetica,Arial,sans-serif;color:#111827;background:#f9fafb}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:24px;margin:8px 0 16px}
h2{font-size:18px;margin:24px 0 8px}
form{display:flex;gap:8px;flex-wrap:wrap}
input{flex:1 1 180px;min-height:44px;padding:0 12px;font:inherit;border:1px solid #9ca3af;border-radius:8px}
button{min-height:44px;min-width:44px;padding:0 14px;font:inherit;border:1px solid #d1d5db;border-radius:8px;background:#e5e7eb;color:#111827}
form button{background:#2563eb;border-color:#2563eb;color:#fff}
ul{list-style:none;padding:0;margin:16px 0}
li{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid #e5e7eb}
li span{flex:1;overflow-wrap:anywhere}
li.done span{text-decoration:line-through;color:#4b5563}
.holders{color:#374151}
.status{color:#374151}
.status.error{color:#b91c1c}
</style>
</head>
<body>
<main>
  <h1>Todos</h1>
  <form id="add"><input name="title" placeholder="What needs doing?" autocomplete="off"><button type="submit">Add</button></form>
  <ul id="todos"></ul>
  <h2 id="seats">Seats</h2>
  <form id="reserve"><input name="name" placeholder="Your name" autocomplete="off"><button type="submit">Reserve</button></form>
  <p class="holders" id="holders"></p>
  <p class="status" id="status"></p>
</main>
<script src="/app.js"></script>
</body>
</html>
